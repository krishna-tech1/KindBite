name: kind_bite
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  intl: ^0.18.1
  cloudinary_api: ^1.1.1
  cloudinary_url_gen: ^1.8.0
  http: ^1.2.0
  image_picker: ^1.0.7
  shimmer: ^3.0.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_logo.png"
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/app_logo.png"
  android_scale: 0.7

flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png
